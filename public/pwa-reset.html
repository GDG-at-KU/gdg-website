<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Resetting GDG KU cache</title></head>
  <body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#101d36;color:#fff;font-family:Arial,sans-serif">
    <p id="message">Resetting the local GDG KU cache...</p>
    <script>
      Promise.all([
        navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then((items) => Promise.all(items.map((item) => item.unregister()))) : Promise.resolve(),
        caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key))))
      ]).then(() => { document.getElementById("message").textContent = "Cache reset. Return to the GDG KU website and refresh once."; });
    </script>
  </body>
</html>
